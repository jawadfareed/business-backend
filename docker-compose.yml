version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: business_postgres
    restart: always
    environment:
      POSTGRES_DB: business_db
      POSTGRES_USER: business_user
      POSTGRES_PASSWORD: strongpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: business_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:
